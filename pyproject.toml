[project]
name = "app"
version = "0.1.0"
description = "FastAPI + LangGraph service boilerplate built around a generate/judge/revise loop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain[openai]>=1.3.16",
    "langgraph>=1.2.11",
    "openinference-instrumentation-langchain>=0.1.76",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.coverage.report]
# configure_telemetry's enabled branch mutates global OTel providers, so it is
# verified by running the stack rather than in-process.
omit = ["src/app/config/telemetry/telemetry.py"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Long prompt strings and field descriptions cannot be usefully wrapped.
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_openai.*", "langchain_core.*"]
ignore_missing_imports = true
